<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Từ vựng Hóa học song ngữ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Gentium+Plus:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f7f6; --surface:#ffffff; --ink:#14302b; --muted:#5b726d;
  --line:#d3e0dd; --accent:#0d7f6f; --accent-ink:#ffffff; --warn:#c2410c; --ok:#15803d;
  --sans:"Be Vietnam Pro",system-ui,sans-serif; --serif:"Bricolage Grotesque","Be Vietnam Pro",system-ui,sans-serif; --ipa:"Gentium Plus","Charis SIL","Noto Serif",Georgia,serif;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0e1b19;--surface:#152623;--ink:#e6f2ef;--muted:#93aaa5;--line:#27403b;--accent:#3fc2ae;--accent-ink:#06201b;--warn:#fb923c;--ok:#4ade80}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--sans)}
.wrap{max-width:820px;margin:0 auto;padding:28px 18px 60px}
h1{font:800 clamp(2rem,6vw,3rem)/1.1 var(--serif);letter-spacing:-.02em;margin:0 0 6px}
.sub{color:var(--muted);margin:0 0 22px}
nav{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:22px}
nav button{font:500 15px var(--sans);background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;color:var(--muted);cursor:pointer}
nav button[aria-selected=true]{color:var(--ink);border-color:var(--accent)}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
input[type=search]{flex:1;min-width:200px;padding:10px 14px;font:inherit;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.btn{font:500 15px var(--sans);padding:10px 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
.item{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:10px}
.item summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.item summary::-webkit-details-marker{display:none}
.item .vi{font-weight:700;font-size:1.1rem}
.item .en{font-family:var(--serif);font-weight:800;letter-spacing:-.01em;color:var(--accent);font-size:1.15rem}
.item .ipa,.ipa{font-family:var(--ipa);color:var(--muted);font-size:1rem}
.tag{margin-left:auto;font-size:.8rem;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 6px}
.item .body{padding:0 16px 16px;border-top:1px dashed var(--line)}
.item p{margin:12px 0 0}
.item .lbl{font-weight:700;font-size:.85rem;color:var(--muted);display:block}
.speak{background:none;border:0;cursor:pointer;font-size:1.1rem;padding:0 4px;color:var(--accent)}
/* flashcard */
.card{perspective:1000px;margin:0 auto 16px;max-width:560px}
.card-inner{position:relative;min-height:300px;transition:transform .5s;transform-style:preserve-3d;cursor:pointer}
.card.flipped .card-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;overflow:auto}
.face.back{transform:rotateY(180deg);align-items:flex-start;text-align:left;justify-content:flex-start}
.face .big{font:800 2.2rem/1.2 var(--serif)}
.face .hint{color:var(--muted);font-size:.85rem;margin-top:14px}
.row{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
.count{color:var(--muted);font-size:.9rem;text-align:center;margin-bottom:10px}
/* quiz */
.q{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px}
.q h2{font:600 1.3rem/1.4 var(--sans);margin:0 0 14px}
.opts{display:grid;gap:8px}
.opts button{text-align:left;padding:12px 14px;font:inherit;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);cursor:pointer}
.opts button.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,transparent)}
.opts button.bad{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 18%,transparent)}
.score{font:800 2.4rem var(--serif);text-align:center;margin:10px 0}
.hidden{display:none}
@media (prefers-reduced-motion:reduce){.card-inner{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Từ vựng Hóa học song ngữ</h1>
  <p class="sub">Việt – Anh · Cấu tạo nguyên tử</p>

  <nav role="tablist">
    <button role="tab" aria-selected="true" data-tab="list">Danh sách</button>
    <button role="tab" aria-selected="false" data-tab="cards">Thẻ ghi nhớ</button>
    <button role="tab" aria-selected="false" data-tab="quiz">Trắc nghiệm</button>
  </nav>

  <section id="list">
    <div class="tools">
      <input type="search" id="search" placeholder="Tìm từ tiếng Việt hoặc tiếng Anh…" aria-label="Tìm từ">
    </div>
    <div id="items"></div>
  </section>

  <section id="cards" class="hidden">
    <div class="count" id="cardCount"></div>
    <div class="card" id="card">
      <div class="card-inner">
        <div class="face front"><div class="big" id="cf"></div><div class="hint">Nhấn để lật thẻ</div></div>
        <div class="face back" id="cb"></div>
      </div>
    </div>
    <div class="row">
      <button class="btn" id="prev">Thẻ trước</button>
      <button class="btn" id="shuffle">Trộn thẻ</button>
      <button class="btn" id="swap">Hiện: Việt</button>
      <button class="btn primary" id="next">Thẻ sau</button>
    </div>
  </section>

  <section id="quiz" class="hidden">
    <div id="quizBox"></div>
  </section>

</div>

<script>
const WORDS = [
 {
  "vi": "Nguyên tử",
  "en": "Atom",
  "type": "N",
  "ipa": "/ˈæt̬.əm/",
  "dvi": "Là hạt nhỏ nhất của một nguyên tố hóa học, vẫn giữ được tính chất hóa học đặc trưng của nguyên tố đó. Nguyên tử gồm hạt nhân mang điện tích dương và lớp vỏ electron mang điện tích âm.",
  "den": "The smallest unit of a chemical element that retains the chemical properties of that element. An atom consists of a positively charged nucleus surrounded by negatively charged electrons."
 },
 {
  "vi": "Proton",
  "en": "Proton",
  "type": "N",
  "ipa": "/ˈprəʊ.tɒn/",
  "dvi": "Hạt mang điện tích dương, nằm trong hạt nhân nguyên tử.",
  "den": "A positively charged subatomic particle found in the nucleus of an atom."
 },
 {
  "vi": "Neutron",
  "en": "Neutron",
  "type": "N",
  "ipa": "/ˈnjuː.trɒn/",
  "dvi": "Hạt không mang điện, nằm trong hạt nhân nguyên tử.",
  "den": "An electrically neutral subatomic particle found in the nucleus of an atom."
 },
 {
  "vi": "Electron",
  "en": "Electron",
  "type": "N",
  "ipa": "/ɪˈlek.trɒn/",
  "dvi": "Hạt mang điện tích âm, chuyển động xung quanh hạt nhân và thuộc lớp vỏ nguyên tử.",
  "den": "A negatively charged subatomic particle that occupies the space surrounding the atomic nucleus."
 },
 {
  "vi": "Kích thước nguyên tử",
  "en": "Atomic size",
  "type": "N",
  "ipa": "/əˈtɒm.ɪk saɪz/",
  "dvi": "Là đại lượng biểu thị kích thước của nguyên tử, thường được xác định thông qua bán kính nguyên tử. Kích thước nguyên tử thường được tính bằng nanomet (nm) hoặc picomet (pm).",
  "den": "A measure of the size of an atom, commonly expressed in terms of its atomic radius. It is usually measured in nanometres (nm) or picometres (pm)."
 },
 {
  "vi": "Điện tích hạt nhân",
  "en": "Nuclear charge",
  "type": "N",
  "ipa": "/ˈnjuː.kli.ər tʃɑːdʒ/",
  "dvi": "Là điện tích dương của hạt nhân nguyên tử, có giá trị bằng tổng điện tích của các proton trong hạt nhân. Điện tích hạt nhân bằng +Z, trong đó Z là số hiệu nguyên tử.",
  "den": "The positive charge of an atomic nucleus, determined by the total number of protons in the nucleus. It is equal to +Z, where Z is the atomic number."
 },
 {
  "vi": "Khối lượng nguyên tử",
  "en": "Atomic mass",
  "type": "N",
  "ipa": "/əˈtɒm.ɪk mæs/",
  "dvi": "Là khối lượng của một nguyên tử, thường được biểu diễn bằng đơn vị khối lượng nguyên tử (u hoặc amu).",
  "den": "The mass of an individual atom, usually expressed in atomic mass units (u or amu)."
 },
 {
  "vi": "Số khối",
  "en": "Mass number",
  "type": "N",
  "ipa": "/mæs ˈnʌm.bər/",
  "dvi": "Là tổng số proton và neutron có trong hạt nhân nguyên tử. Số khối được ký hiệu là A.",
  "den": "The total number of protons and neutrons in the nucleus of an atom. It is represented by the symbol A."
 },
 {
  "vi": "Hạt nhân",
  "en": "Nucleus",
  "type": "N",
  "ipa": "/ˈnjuː.kli.əs/",
  "dvi": "Là phần trung tâm của nguyên tử, chứa proton và neutron (ngoại trừ đồng vị protium của hydrogen chỉ có một proton). Hạt nhân mang điện tích dương và tập trung gần như toàn bộ khối lượng nguyên tử.",
  "den": "The central core of an atom, containing protons and neutrons (except for the hydrogen-1 isotope, which contains only one proton). The nucleus is positively charged and contains almost all of the atom's mass."
 },
 {
  "vi": "Vỏ nguyên tử",
  "en": "Electron shell",
  "type": "N",
  "ipa": "/ɪˈlek.trɒn ʃel/",
  "dvi": "Là khu vực xung quanh hạt nhân, nơi các electron phân bố theo những lớp năng lượng nhất định.",
  "den": "The region surrounding the nucleus where electrons are distributed among different energy levels or shells."
 }
];

const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffleArr = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]} return a };

function speak(text){
  if(!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text); u.lang = "en-GB"; u.rate = .85;
  speechSynthesis.speak(u);
}

/* Tabs */
document.querySelectorAll("nav button").forEach(b => b.onclick = () => {
  document.querySelectorAll("nav button").forEach(x => x.setAttribute("aria-selected", x === b));
  ["list","cards","quiz"].forEach(id => $("#"+id).classList.toggle("hidden", id !== b.dataset.tab));
});

/* List */
function renderList(q=""){
  q = q.trim().toLowerCase();
  const rows = WORDS.filter(w => (w.vi+" "+w.en).toLowerCase().includes(q));
  $("#items").innerHTML = rows.length ? rows.map(w => `
    <details class="item">
      <summary>
        <span class="vi">${esc(w.vi)}</span>
        <span class="en">${esc(w.en)}</span>
        <span class="ipa">${esc(w.ipa)}</span>
        <button class="speak" data-say="${esc(w.en)}" aria-label="Nghe phát âm ${esc(w.en)}">🔊</button>
        <span class="tag">${esc(w.type)}</span>
      </summary>
      <div class="body">
        <p><span class="lbl">Định nghĩa tiếng Việt</span>${esc(w.dvi)}</p>
        <p><span class="lbl">English definition</span>${esc(w.den)}</p>
      </div>
    </details>`).join("") : "<p>Không tìm thấy từ phù hợp.</p>";
}
$("#search").oninput = e => renderList(e.target.value);
$("#items").addEventListener("click", e => {
  const s = e.target.closest(".speak");
  if(s){ e.preventDefault(); speak(s.dataset.say); }
});

/* Flashcards */
let deck = WORDS.slice(), idx = 0, showVi = true;
function renderCard(){
  const w = deck[idx];
  $("#card").classList.remove("flipped");
  $("#cardCount").textContent = `Thẻ ${idx+1} / ${deck.length}`;
  $("#cf").textContent = showVi ? w.vi : w.en;
  $("#cb").innerHTML = `
    <div class="big">${esc(showVi ? w.en : w.vi)}</div>
    <div class="ipa">${esc(w.ipa)}</div>
    <p><span class="lbl">Định nghĩa tiếng Việt: </span>${esc(w.dvi)}</p>
    <p><span class="lbl">English definition: </span>${esc(w.den)}</p>`;
}
$("#card").onclick = () => $("#card").classList.toggle("flipped");
$("#next").onclick = () => { idx = (idx+1) % deck.length; renderCard(); };
$("#prev").onclick = () => { idx = (idx-1+deck.length) % deck.length; renderCard(); };
$("#shuffle").onclick = () => { deck = shuffleArr(WORDS); idx = 0; renderCard(); };
$("#swap").onclick = e => { showVi = !showVi; e.target.textContent = "Hiện: " + (showVi ? "Việt" : "Anh"); renderCard(); };

/* Quiz */
let qs = [], qi = 0, score = 0;
function startQuiz(){
  qs = shuffleArr(WORDS).map(w => {
    const mode = Math.random() < .5 ? "vi2en" : "def2en";
    const wrong = shuffleArr(WORDS.filter(x => x !== w)).slice(0,3);
    return { w, mode, opts: shuffleArr([w, ...wrong]) };
  });
  qi = 0; score = 0; renderQ();
}
function renderQ(){
  const box = $("#quizBox");
  if(qi >= qs.length){
    box.innerHTML = `<div class="q"><div class="score">${score} / ${qs.length}</div>
      <p style="text-align:center">${score === qs.length ? "Chính xác tuyệt đối!" : "Hãy luyện thêm bằng thẻ ghi nhớ rồi làm lại."}</p>
      <div class="row"><button class="btn primary" id="again">Làm lại</button></div></div>`;
    $("#again").onclick = startQuiz; return;
  }
  const q = qs[qi];
  const prompt = q.mode === "vi2en"
    ? `Từ “${esc(q.w.vi)}” trong tiếng Anh là gì?`
    : `Định nghĩa nào sau đây ứng với từ nào?<br><em style="font-weight:400">${esc(q.w.den)}</em>`;
  box.innerHTML = `<div class="count">Câu ${qi+1} / ${qs.length}</div>
    <div class="q"><h2>${prompt}</h2>
    <div class="opts">${q.opts.map((o,i)=>`<button data-i="${i}">${esc(o.en)}</button>`).join("")}</div>
    <div class="row" style="margin-top:14px"><button class="btn primary hidden" id="nextQ">Câu tiếp</button></div></div>`;
  box.querySelectorAll(".opts button").forEach(b => b.onclick = () => {
    const pick = q.opts[+b.dataset.i];
    box.querySelectorAll(".opts button").forEach((x,i) => {
      x.disabled = true;
      if(q.opts[i] === q.w) x.classList.add("ok");
    });
    if(pick === q.w) score++; else b.classList.add("bad");
    $("#nextQ").classList.remove("hidden");
    $("#nextQ").focus();
  });
  $("#nextQ").onclick = () => { qi++; renderQ(); };
}

renderList(); renderCard(); startQuiz();
</script>
</body>
</html>
